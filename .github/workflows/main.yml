name: Build ModMenu dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install iOS SDKs
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git tmp
          mv tmp/*.sdk ./ || true
          rm -rf tmp

      - name: Build
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Find dylib
        run: |
          find . -name "*.dylib" -not -path "*/subprojects/*"
          ls -la .theos/obj/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-dylib
          path: |
            .theos/obj/**/*.dylib
            **/*.dylib
          if-no-files-found: warn
