name: Build ModMenu dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode 14
        run: |
          sudo xcode-select -s /Applications/Xcode_14.3.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_14.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version || true
          clang --version || true

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install iOS SDKs
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git tmp
          mv tmp/*.sdk ./ 2>/dev/null || true
          rm -rf tmp
          ls -la $THEOS/sdks/

      - name: Patch Makefile with silent flags
        run: |
          if [ ! -f Makefile ]; then
            echo "no Makefile, skipping patch"
            exit 0
          fi

          echo "=== original Makefile ==="
          cat Makefile

          # append flags tắt warning
          cat >> Makefile << 'MAKEEOF'

          # --- CI patch: suppress Xcode 15/16 warnings ---
          export ADDITIONAL_CFLAGS = -Wno-everything
          export ADDITIONAL_CXXFLAGS = -Wno-everything -std=c++17
          export ADDITIONAL_OBJCFLAGS = -Wno-everything -fobjc-arc
          export ADDITIONAL_OBJCXXFLAGS = -Wno-everything -std=c++17 -fobjc-arc
          export ADDITIONAL_LDFLAGS = -Wl,-no_warn_duplicate_libraries
          MAKEEOF

          echo "=== patched Makefile tail ==="
          tail -15 Makefile

      - name: Build (try multiple targets)
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          export THEOS_PACKAGE_SCHEME=rootless

          # xoá build cache cũ
          make clean 2>/dev/null || true
          rm -rf .theos 2>/dev/null || true

          # thử nhiều cách build theo thứ tự ưu tiên
          set +e
          make package FINALPACKAGE=1 2>&1 | tee build.log
          RC=$?

          if [ $RC -ne 0 ]; then
            echo "--- package failed, trying 'all' ---"
            make all FINALPACKAGE=1 2>&1 | tee build.log
            RC=$?
          fi

          if [ $RC -ne 0 ]; then
            echo "--- all failed, trying plain make ---"
            make FINALPACKAGE=1 2>&1 | tee build.log
            RC=$?
          fi

          if [ $RC -ne 0 ]; then
            echo "--- plain make failed, trying rootless scheme ---"
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log
            RC=$?
          fi

          # luôn thoát 0 để step sau chạy
          echo "=== final make exit: $RC ==="
          exit 0

      - name: Find and extract all binaries
        if: always()
        run: |
          mkdir -p output

          echo "=== search .dylib ==="
          find . -name "*.dylib" -not -path "*/subprojects/*" -not -path "*/node_modules/*" \
            -exec cp -v {} output/ \; 2>/dev/null

          echo "=== search .deb ==="
          DEBS=$(find . -name "*.deb" -not -path "*/subprojects/*" 2>/dev/null)
          for deb in $DEBS; do
            echo "extracting: $deb"
            if command -v dpkg-deb >/dev/null 2>&1; then
              dpkg-deb -x "$deb" deb_extract/
            else
              mkdir -p deb_extract
              ar x "$deb" 2>/dev/null
              ls -la
              [ -f data.tar.xz ] && tar -xf data.tar.xz -C deb_extract/
              [ -f data.tar.gz ] && tar -xf data.tar.gz -C deb_extract/
              [ -f data.tar.lzma ] && tar -xf data.tar.lzma -C deb_extract/
              [ -f data.tar.bz2 ] && tar -xf data.tar.bz2 -C deb_extract/
            fi
          done

          find deb_extract -name "*.dylib" -exec cp -v {} output/ \; 2>/dev/null

          echo "=== search .framework ==="
          find . -name "*.framework" -not -path "*/subprojects/*" \
            -exec cp -rv {} output/ \; 2>/dev/null

          echo ""
          echo "=== output contents ==="
          ls -laR output/

      - name: Show build log tail
        if: always()
        run: |
          echo "=== last 80 lines of build.log ==="
          tail -80 build.log 2>/dev/null || echo "no build.log"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-build-output
          path: |
            output/**
            build.log
          if-no-files-found: warn
          retention-days: 30
